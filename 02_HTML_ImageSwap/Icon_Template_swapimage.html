<!DOCTYPE html>
<html>
    
    <head>
    <title>Icon Template Square</title>
        <style>
            body{
            background-color: #ffebe6;
            margin: 0;
          }
            .row{
                margin-top:40px;
            }
            .left-column{
                float:left;
                width:30%;
                margin-left:30px;
            }
            .center-column{
                width:30%;
                margin:auto;
            }
            .right-column{
                float:right;
                width:30%;
                margin:auto;
            }
            .image-container{
                display: table-cell;
                vertical-align: middle;
                margin: auto;
            }
        </style>
    </head>

    <body>

        <div class="row">
            <div class="left-column"><div class="icon-container">
                <img id="img1" src="icon/1.svg" height="200" width="200"
                    onmousedown= "this.src='icon/1i.svg';"
                    onmouseup= "this.src='icon/1.svg';"
                /></div>
            
            </div>
            
            <div class="right-column"><div class="icon-container">
                <img id="img2" src="icon/2.svg" height="200" width="200"
                    onmousedown= "this.src='icon/2i.svg';"
                    onmouseup= "this.src='icon/2.svg';"                     
                /></div>
            </div>
            
            <div class="center-column"><div class="icon-container">
                <img id="img3" src="icon/3.svg" height="200" width="200"
                    onmousedown= "this.src='icon/3i.svg';"
                    onmouseup= "this.src='icon/3.svg';"
                /></div>
            </div>
        </div>

        <div class="row">

            <div class="left-column"><div class="icon-container">
                <img id="img4" src="icon/4.svg" height="200" width="200"
                    onmousedown= "this.src='icon/4i.svg';"
                    onmouseup= "this.src='icon/4.svg';"
                /></div>
            </div>

            <div class="right-column"><div class="icon-container">
                <img id="img5" src="icon/5.svg" height="200" width="200"
                    onmousedown= "this.src='icon/5i.svg';"
                    onmouseup= "this.src='icon/5.svg';"
                /></div>
            </div>

            <div class="center-column"><div class="icon-container">
                <img id="img6" src="icon/6.svg" height="200" width="200"
                    onmousedown= "this.src='icon/6i.svg';"
                    onmouseup= "this.src='icon/6.svg';"
                /></div>
            </div>
        </div> 

        <div class="row">
            <div class="left-column"><div class="icon-container">
                <img id="img7" src="icon/7.svg" height="200" width="200"
                    onmousedown= "this.src='icon/7i.svg';"
                    onmouseup= "this.src='icon/7.svg';"
                /></div>
            </div>

            <div class="right-column"><div class="icon-container">
                <img id="img8" src="icon/8.svg" height="200" width="200"
                    onmousedown= "this.src='icon/8i.svg';"
                    onmouseup= "this.src='icon/8.svg';"
                /></div>
            </div>

            <div class="center-column"><div class="icon-container">
                <img id="img9" src="icon/9.svg" height="200" width="200"
                    onmousedown= "this.src='icon/9i.svg';"
                    onmouseup= "this.src='icon/9.svg';"
                /></div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.1/buzz.min.js"></script>    
        <script>
            var sound1 = new buzz.sound("sound/s1.wav");
            var sound2 = new buzz.sound("sound/s2.wav");
            var sound3 = new buzz.sound("sound/s3.wav");
            var sound4 = new buzz.sound("sound/s4.wav");
            var sound5 = new buzz.sound("sound/s5.wav");
            var sound6 = new buzz.sound("sound/s6.wav");
            var sound7 = new buzz.sound("sound/s7.wav");
            var sound8 = new buzz.sound("sound/s8.wav");
            var sound9 = new buzz.sound("sound/s9.wav");

            window.onload = function() {
                document.getElementById('img1').addEventListener('mousedown', function () {sound1.play(); });  
                document.getElementById('img2').addEventListener('mousedown', function () {sound2.play(); });
                document.getElementById('img3').addEventListener('mousedown', function () {sound3.play(); });
                document.getElementById('img4').addEventListener('mousedown', function () {sound4.play(); });
                document.getElementById('img5').addEventListener('mousedown', function () {sound5.play(); }); 
                document.getElementById('img6').addEventListener('mousedown', function () {sound6.play(); }); 
                document.getElementById('img7').addEventListener('mousedown', function () {sound7.play(); }); 
                document.getElementById('img8').addEventListener('mousedown', function () {sound8.play(); }); 
                document.getElementById('img9').addEventListener('mousedown', function () {sound9.play(); });
            }  
        </script>   
    </body>
    
</html>
